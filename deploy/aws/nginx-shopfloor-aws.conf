# nginx — ShopFloor na AWS (staging)
# app  → awsshopfloor.enterplak.com.br     → Next.js (127.0.0.1:3000)
# api  → apiawsshopfloor.enterplak.com.br  → Supabase gateway/Envoy (127.0.0.1:8000)
#
# Instalar:
#   sudo cp deploy/aws/nginx-shopfloor-aws.conf /etc/nginx/sites-available/shopfloor-aws
#   sudo ln -sf /etc/nginx/sites-available/shopfloor-aws /etc/nginx/sites-enabled/shopfloor-aws
#   sudo nginx -t && sudo systemctl reload nginx
# Depois o TLS:
#   sudo certbot --nginx -d awsshopfloor.enterplak.com.br -d apiawsshopfloor.enterplak.com.br
# (o certbot reescreve estes blocos pra 443 + redirect 80→443 automaticamente)

# ---- APP (Next.js) ----
server {
  listen 80;
  server_name awsshopfloor.enterplak.com.br;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}

# ---- API (Supabase self-hosted / Envoy) ----
server {
  listen 80;
  server_name apiawsshopfloor.enterplak.com.br;

  # anexos/foto podem ser grandes
  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}

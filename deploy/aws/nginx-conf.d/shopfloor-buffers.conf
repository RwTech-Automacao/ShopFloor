# Buffers de cabeçalho do proxy (nginx na Lightsail). Instalar em /etc/nginx/conf.d/shopfloor-buffers.conf
# (o nginx.conf já faz `include /etc/nginx/conf.d/*.conf;` no bloco http).
#
# Por quê (22/10/2026): sem estas linhas valia o padrão do nginx (4 a 8 KB para o cabeçalho da resposta).
# Em respostas do app com cabeçalhos grandes (cookies da sessão do Supabase renovados, por exemplo) o
# nginx devolvia 502 "upstream sent too big header" na gravação do bipe (POST /shopfloor/operar/lancamento):
# a ação JÁ tinha gravado e a tela mostrava erro. Foram 12 ocorrências entre 21 e 22/10.
#
# Aplicar: sudo cp deploy/aws/nginx-conf.d/shopfloor-buffers.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
# Reverter: sudo rm /etc/nginx/conf.d/shopfloor-buffers.conf && sudo systemctl reload nginx
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
